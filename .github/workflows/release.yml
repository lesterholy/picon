name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Verify
        run: swift run PiconCheck

      - name: Package app
        run: ./scripts/package-local-app.sh

      - name: Create archive and checksums
        run: |
          ditto -c -k --keepParent build/Picon.app Picon-macOS.zip
          shasum -a 256 Picon-macOS.zip > Picon-macOS.zip.sha256

      - name: Write release notes
        run: |
          {
            echo "Picon ${GITHUB_REF_NAME}"
            echo
            echo "Unsigned local macOS app bundle built from this tag."
            echo
            echo "Install by unzipping the archive and copying Picon.app to /Applications."
          } > RELEASE_NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            Picon-macOS.zip \
            Picon-macOS.zip.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
